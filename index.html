<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ALVARENO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --surface: #F6F6F4; --ink: #1B1D19; --muted: #6B6E64; --line: #E4E4DF;
    --brand: #1F3D2E; --brand-solid-hover: #2A4F3B; --accent: #C97A2B; --danger-badge: #B23A2E;
    --demo-bg: #FFF6E6; --demo-border: #E8C77A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font-family: 'Inter', sans-serif; }

  .utility-bar { background: var(--brand); color: #EFEFE9; font-size: 13px; text-align: center; padding: 7px 12px; }

  header { background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  .header-top { max-width: 1200px; margin: 0 auto; padding: 18px 24px 0; display: flex; align-items: center; gap: 24px; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 19px; letter-spacing: -0.01em; color: var(--brand); cursor: pointer; flex-shrink: 0; }
  .logo svg { width: 24px; height: 24px; }
  .header-actions { margin-left: auto; display: flex; align-items: center; gap: 20px; font-size: 14px; color: var(--ink); }
  .header-actions .action { display: flex; align-items: center; gap: 6px; cursor: pointer; position: relative; white-space: nowrap; }
  .header-actions svg { width: 20px; height: 20px; }
  .cart-count { background: var(--brand); color: white; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 6px; }
  .lang-switch { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang-btn { border: none; background: none; padding: 4px 8px; border-radius: 999px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .lang-btn.active { background: var(--surface); color: var(--ink); font-weight: 600; }

  .search-row { max-width: 1200px; margin: 16px auto 0; padding: 0 24px; }
  .search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 13px 16px; }
  .search-box:focus-within { border-color: var(--brand); }
  .search-box svg { width: 19px; height: 19px; color: var(--muted); flex-shrink: 0; }
  .search-box input { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; color: var(--ink); }
  .search-box input::placeholder { color: var(--muted); }

  nav.category-row { max-width: 1200px; margin: 0 auto; padding: 14px 24px 16px; display: flex; gap: 10px; font-size: 14px; flex-wrap: wrap; }
  .cat-btn { border: 1px solid var(--line); background: var(--bg); padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--ink); }
  .cat-btn:hover { border-color: var(--brand); }
  .cat-btn.active { background: var(--brand); border-color: var(--brand); color: white; }

  .hero { background: var(--surface); padding: 30px 24px; }
  .hero-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .hero-inner h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .hero-inner p { margin: 0; color: var(--muted); font-size: 14px; }

  .section { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
  .section-title { font-size: 21px; font-weight: 700; margin: 0 0 22px; }
  .empty-note { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 26px; }
  .card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color 0.15s ease; background: var(--bg); }
  .card:hover { border-color: var(--brand); }
  .card .img-wrap { aspect-ratio: 1/1; background: var(--surface); position: relative; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; top: 10px; left: 10px; background: var(--danger-badge); color: white; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
  .badge.stock-low { background: var(--accent); }
  .badge.stock-out { background: var(--muted); }
  .card-body { padding: 14px; }
  .card-body h3 { font-size: 14.5px; font-weight: 500; margin: 0 0 5px; line-height: 1.3; }
  .cat-tag { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .rating { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .rating .stars { color: var(--accent); }
  .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .price { font-size: 17px; font-weight: 700; }
  .price-old { font-size: 13px; color: var(--muted); text-decoration: line-through; }
  .add-btn { width: 100%; padding: 9px; background: var(--brand); color: white; border: none; border-radius: 6px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .add-btn:hover { background: var(--brand-solid-hover); }
  .add-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  .trust-strip { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }
  .trust-inner { max-width: 1200px; margin: 0 auto; padding: 26px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
  .trust-item { display: flex; align-items: center; gap: 12px; font-size: 13.5px; }
  .trust-item svg { width: 26px; height: 26px; color: var(--brand); flex-shrink: 0; }
  .trust-item strong { display: block; font-size: 14px; }
  .trust-item span { color: var(--muted); }

  footer { background: var(--ink); color: #C9CAC3; padding: 44px 24px 24px; font-size: 13.5px; }
  .footer-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 32px; }
  .footer-inner h4 { color: white; font-size: 14px; margin: 0 0 12px; }
  .footer-inner a { display: block; color: #A9AAA2; margin-bottom: 8px; cursor: pointer; }
  .footer-inner a:hover { color: white; }
  .footer-bottom { max-width: 1200px; margin: 30px auto 0; padding-top: 20px; border-top: 1px solid #33352F; display: flex; justify-content: space-between; color: #7E8078; flex-wrap: wrap; gap: 10px; }

  .detail-view, .admin-view, .checkout-view, .cart-view, .auth-view { display: none; }
  .detail-view.active, .admin-view.active, .checkout-view.active, .cart-view.active, .auth-view.active { display: block; }
  .home-view.hidden { display: none; }

  .back-link { max-width: 1200px; margin: 0 auto; padding: 20px 24px 0; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .back-link:hover { color: var(--ink); }

  .detail-grid { max-width: 1200px; margin: 0 auto; padding: 24px 24px 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .gallery-main { aspect-ratio: 1/1; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .gallery-main img { width: 100%; height: 100%; object-fit: cover; }
  .gallery-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .gallery-thumbs div { aspect-ratio: 1; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .gallery-thumbs img { width: 100%; height: 100%; object-fit: cover; }

  .detail-info h1 { font-size: 25px; font-weight: 700; margin: 0 0 8px; }
  .stock-note { font-size: 13.5px; margin-top: 4px; }
  .stock-note.ok { color: var(--brand); }
  .stock-note.low { color: var(--accent); }
  .stock-note.out { color: var(--muted); }
  .detail-price-row { display: flex; align-items: baseline; gap: 12px; margin: 18px 0; }
  .detail-price { font-size: 26px; font-weight: 700; }
  .detail-desc { color: #4C4E47; font-size: 14.5px; line-height: 1.65; max-width: 440px; }

  .variants { margin-top: 26px; }
  .variants legend { font-size: 13px; color: var(--muted); margin-bottom: 9px; }
  .variant-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .variant-options label { border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  .variant-options input { display: none; }
  .variant-options label:has(input:checked) { border-color: var(--brand); color: var(--brand); background: #EEF3EF; }

  .actions { display: flex; gap: 12px; margin-top: 28px; }
  .btn-outline, .btn-solid { flex: 1; padding: 13px 20px; font-size: 14.5px; font-weight: 600; border-radius: 7px; cursor: pointer; }
  .btn-outline { border: 1px solid var(--ink); background: transparent; color: var(--ink); }
  .btn-outline:hover { background: var(--surface); }
  .btn-solid { border: none; background: var(--brand); color: white; }
  .btn-solid:hover { background: var(--brand-solid-hover); }
  .btn-solid:disabled, .btn-outline:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; border-color: var(--line); }

  .section-block { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 34px; }
  .section-block h2 { font-size: 16px; font-weight: 700; margin: 0 0 10px; }

  .review { margin-bottom: 18px; }
  .review-head { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .review-head .stars { color: var(--accent); }
  .review-head .author { color: var(--muted); font-weight: 500; }
  .review p { color: #4C4E47; font-size: 14px; line-height: 1.6; margin: 4px 0 0; max-width: 440px; }

  .review-form { max-width: 440px; margin-top: 18px; padding: 16px; background: var(--surface); border-radius: 8px; }
  .review-form label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .review-form input, .review-form select, .review-form textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; margin-bottom: 12px; background: white; }
  .review-form textarea { resize: vertical; min-height: 60px; }
  .review-form button { padding: 10px 18px; background: var(--brand); color: white; border: none; border-radius: 6px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .review-form button:hover { background: var(--brand-solid-hover); }
  .review-locked { max-width: 440px; margin-top: 18px; padding: 16px; background: var(--surface); border-radius: 8px; font-size: 13.5px; color: var(--muted); }
  .review-locked a { color: var(--brand); text-decoration: underline; cursor: pointer; }

  .cart-wrap { max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; }
  .cart-wrap h1 { font-size: 22px; margin: 0 0 24px; }
  .cart-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .cart-row img { width: 68px; height: 68px; object-fit: cover; border-radius: 7px; background: var(--surface); }
  .cart-row .info { flex: 1; }
  .cart-row .info .name { font-weight: 600; font-size: 14.5px; }
  .cart-row .info .unit-price { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .cart-qty { display: flex; align-items: center; gap: 8px; }
  .cart-qty button { width: 26px; height: 26px; border: 1px solid var(--line); background: white; border-radius: 5px; cursor: pointer; font-size: 14px; }
  .cart-qty span { min-width: 18px; text-align: center; font-size: 14px; }
  .cart-row .line-total { width: 80px; text-align: right; font-weight: 700; font-size: 14.5px; }
  .cart-remove { color: var(--danger-badge); font-size: 12.5px; cursor: pointer; margin-left: 14px; }
  .cart-total-row { display: flex; justify-content: space-between; align-items: center; padding: 22px 0 6px; font-size: 17px; font-weight: 700; }
  .cart-empty { color: var(--muted); font-size: 14.5px; padding: 20px 0; }

  .checkout-wrap { max-width: 640px; margin: 0 auto; padding: 32px 24px 80px; }
  .checkout-wrap h1 { font-size: 22px; margin: 0 0 6px; }
  .checkout-wrap .checkout-sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  .checkout-summary-row { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: var(--surface); border-radius: 8px; margin-bottom: 10px; }
  .checkout-summary-row img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
  .checkout-summary-row .name { font-weight: 600; font-size: 14px; }
  .checkout-summary-row .qty { color: var(--muted); font-size: 13px; margin-left: 6px; }
  .checkout-summary-row .price { margin-left: auto; font-weight: 700; font-size: 14.5px; }
  .checkout-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; padding: 14px 14px 0; margin-bottom: 24px; }
  .checkout-fieldgroup { margin-bottom: 26px; }
  .checkout-fieldgroup h2 { font-size: 15px; margin: 0 0 14px; }
  .checkout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .checkout-grid .full { grid-column: 1 / -1; }
  .checkout-grid label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .checkout-grid input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
  .checkout-grid input:focus { outline: none; border-color: var(--brand); }
  .payment-toggle { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .payment-toggle label { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 7px; padding: 10px 14px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .payment-toggle input { margin: 0; }
  .payment-toggle label:has(input:checked) { border-color: var(--brand); background: #EEF3EF; }
  .checkout-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .checkout-submit { width: 100%; padding: 14px; background: var(--brand); color: white; border: none; border-radius: 7px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .checkout-submit:hover { background: var(--brand-solid-hover); }
  .order-confirm { text-align: center; padding: 60px 24px; }
  .order-confirm h1 { font-size: 22px; margin: 0 0 10px; }
  .order-confirm p { color: var(--muted); font-size: 14.5px; }
  .order-confirm button { margin-top: 24px; padding: 11px 22px; background: var(--brand); color: white; border: none; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; }

  .auth-wrap { max-width: 420px; margin: 60px auto; padding: 0 24px; }
  .auth-wrap h1 { font-size: 21px; margin: 0 0 6px; }
  .auth-wrap .auth-sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .auth-wrap label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .auth-wrap input, .auth-wrap select { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 7px; font-size: 14px; margin-bottom: 16px; }
  .auth-wrap input:focus { outline: none; border-color: var(--brand); }
  .auth-wrap button.primary { width: 100%; padding: 12px; background: var(--brand); color: white; border: none; border-radius: 7px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .auth-switch { text-align: center; font-size: 13.5px; color: var(--muted); margin-top: 18px; }
  .auth-switch a { color: var(--brand); cursor: pointer; text-decoration: underline; }
  .auth-error { color: var(--danger-badge); font-size: 13px; margin: -8px 0 14px; display: none; }
  .verify-toggle { display: flex; gap: 10px; margin-bottom: 16px; }
  .verify-toggle label { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; font-size: 13.5px; cursor: pointer; text-align: center; }
  .verify-toggle input { display: none; }
  .verify-toggle label:has(input:checked) { border-color: var(--brand); background: #EEF3EF; color: var(--brand); }
  .demo-code-box { background: var(--demo-bg); border: 1px solid var(--demo-border); border-radius: 8px; padding: 14px; font-size: 13.5px; margin-bottom: 18px; line-height: 1.5; }
  .demo-code-box strong { font-size: 20px; letter-spacing: 0.1em; display: block; margin-top: 4px; }
  .resend-link { font-size: 13px; color: var(--muted); text-align: center; margin-top: 12px; }
  .resend-link a { color: var(--brand); cursor: pointer; text-decoration: underline; }

  .admin-login { max-width: 380px; margin: 90px auto; padding: 0 24px; }
  .admin-login h1 { font-size: 21px; margin: 0 0 6px; }
  .admin-login p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .admin-login label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .admin-login input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 7px; font-size: 14px; margin-bottom: 18px; }
  .admin-login input:focus { outline: none; border-color: var(--brand); }
  .admin-login button { width: 100%; padding: 12px; background: var(--brand); color: white; border: none; border-radius: 7px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .admin-error { color: var(--danger-badge); font-size: 13px; margin: -10px 0 16px; display: none; }

  .admin-dash { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  .admin-dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .admin-dash-header h1 { font-size: 22px; margin: 0; }
  .admin-logout { font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .admin-logout:hover { color: var(--ink); }

  .admin-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 24px; flex-wrap: wrap; }
  .admin-tab-btn { border: none; background: none; padding: 10px 16px; font-size: 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .admin-tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  .admin-tab-panel { display: none; }
  .admin-tab-panel.active { display: block; }

  .admin-panel { border: 1px solid var(--line); border-radius: 10px; padding: 22px; margin-bottom: 28px; }
  .admin-panel h2 { font-size: 16px; margin: 0 0 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .admin-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .admin-form-grid .full { grid-column: 1 / -1; }
  .admin-form-grid label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .admin-form-grid input, .admin-form-grid select, .admin-form-grid textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
  .admin-form-grid textarea { min-height: 60px; resize: vertical; }
  .admin-submit { margin-top: 16px; padding: 10px 20px; background: var(--brand); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .admin-submit:hover { background: var(--brand-solid-hover); }
  .admin-cancel { margin-top: 16px; margin-left: 10px; padding: 10px 20px; background: none; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; cursor: pointer; }

  table.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.admin-table th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 500; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.02em; }
  table.admin-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.admin-table img { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; }
  .stock-input { width: 70px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; font-size: 13.5px; }
  .table-input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; font-size: 13px; }
  .status-select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; font-size: 13px; }
  .row-actions { display: flex; gap: 8px; }
  .delete-btn, .edit-btn { border: 1px solid var(--line); background: none; padding: 6px 12px; border-radius: 5px; font-size: 12.5px; cursor: pointer; }
  .delete-btn { border-color: var(--danger-badge); color: var(--danger-badge); }
  .delete-btn:hover { background: var(--danger-badge); color: white; }
  .edit-btn:hover { border-color: var(--brand); color: var(--brand); }
  .verified-pill { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .verified-pill.yes { background: #E3F1E8; color: var(--brand); }
  .verified-pill.no { background: #F5E6E3; color: var(--danger-badge); }

  .cat-manage-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .cat-add-row { display: flex; gap: 10px; margin-top: 14px; }
  .cat-add-row input { flex: 1; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
  .cat-add-row button { padding: 9px 16px; background: var(--brand); color: white; border: none; border-radius: 6px; font-size: 13.5px; font-weight: 600; cursor: pointer; }

  .orders-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .orders-toolbar input, .orders-toolbar select { padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; }
  .orders-toolbar input { flex: 1; min-width: 180px; }
  .orders-count { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

  @media (max-width: 760px) {
    .detail-grid { grid-template-columns: 1fr; }
    .admin-form-grid, .checkout-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="utility-bar" id="utility-bar-text">Free shipping from €60</div>

<header id="header">
  <div class="header-top">
    <div class="logo" onclick="showHome()">
      <svg viewBox="0 0 64 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 L54 52 H45.5 L32 21.5 L18.5 52 H10 L32 4 Z" fill="currentColor"/>
        <path d="M14 44.5 C 24 30, 40 30, 50 38" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      </svg>
      ALVARENO
    </div>
    <div class="header-actions">
      <div class="lang-switch">
        <button class="lang-btn" id="lang-btn-en" onclick="setLang('en')">🇬🇧 EN</button>
        <button class="lang-btn" id="lang-btn-de" onclick="setLang('de')">🇩🇪 DE</button>
      </div>
      <div class="action" id="account-action" onclick="showAuth('login')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 5-6 7.5-6s6 2 7.5 6"/></svg>
        <span id="account-label">Sign in</span>
      </div>
      <div class="action" onclick="showAdmin()">

      </div>
      <div class="action" onclick="showCart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>

        <span class="cart-count" id="cart-count">0</span>
      </div>
    </div>
  </div>

  <div class="search-row">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" oninput="handleSearch(this.value)" />
    </div>
  </div>

  <nav class="category-row" id="category-row"></nav>
</header>

<div id="home-view" class="home-view">
  <div class="hero">
    <div class="hero-inner">
      <div>
        <h1 id="hero-title"></h1>
        <p id="hero-sub"></p>
      </div>
    </div>
  </div>
  <div class="section">
    <h2 class="section-title" id="grid-title"></h2>
    <div class="grid" id="product-grid"></div>
  </div>
  <div class="trust-strip">
    <div class="trust-inner">
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h13v10H3z"/><path d="M16 10h3l2 3v4h-5"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="17.5" cy="18.5" r="1.5"/></svg>
        <div><strong id="trust1-title"></strong><span id="trust1-sub"></span></div>
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/></svg>
        <div><strong id="trust2-title"></strong><span id="trust2-sub"></span></div>
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
        <div><strong id="trust3-title"></strong><span id="trust3-sub"></span></div>
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10Z"/></svg>
        <div><strong id="trust4-title"></strong><span id="trust4-sub"></span></div>
      </div>
    </div>
  </div>
</div>

<section class="detail-view" id="detail-view">
  <div class="back-link" id="detail-back" onclick="showHome()"></div>
  <div class="detail-grid" id="detail-content"></div>
</section>

<section class="cart-view" id="cart-view">
  <div class="back-link" id="cart-back" onclick="showHome()"></div>
  <div class="cart-wrap" id="cart-wrap"></div>
</section>

<section class="checkout-view" id="checkout-view">
  <div class="back-link" id="checkout-back" onclick="showCart()"></div>
  <div class="checkout-wrap" id="checkout-form-wrap"></div>
  <div class="checkout-wrap" id="checkout-confirm-wrap" style="display:none;"></div>
</section>

<section class="auth-view" id="auth-view">
  <div class="back-link" id="auth-back" onclick="showHome()"></div>
  <div class="auth-wrap" id="auth-wrap"></div>
</section>

<section class="admin-view" id="admin-view">
  <div class="admin-login" id="admin-login-block">
    <h1 id="admin-login-title"></h1>
    <p id="admin-login-sub"></p>
    <p class="admin-error" id="admin-error"></p>
    <label id="admin-email-label"></label>
    <input id="admin-email" type="email" placeholder="name@alvareno.de" />
    <label id="admin-pass-label"></label>
    <input id="admin-pass" type="password" placeholder="••••••••" />
    <button id="admin-login-btn" onclick="attemptAdminLogin()"></button>
  </div>

  <div class="admin-dash" id="admin-dash-block" style="display:none;">
    <div class="admin-dash-header">
      <h1 id="admin-dash-title"></h1>
      <span class="admin-logout" id="admin-to-shop" onclick="showHome()"></span>
    </div>

    <div class="admin-tabs" id="admin-tabs"></div>

    <div class="admin-tab-panel" id="tab-products">
      <div class="admin-panel">
        <h2 id="product-form-title"></h2>
        <div class="admin-form-grid">
          <div><label id="lbl-product-name"></label><input id="new-name" type="text" /></div>
          <div><label id="lbl-category"></label><select id="new-category"></select></div>
          <div><label id="lbl-price"></label><input id="new-price" type="number" min="0" step="1" /></div>
          <div><label id="lbl-stock"></label><input id="new-stock" type="number" min="0" step="1" /></div>
          <div class="full"><label id="lbl-images"></label><input id="new-image" type="text" placeholder="https://img1.jpg, https://img2.jpg" /></div>
          <div class="full"><label id="lbl-shortdesc"></label><textarea id="new-desc"></textarea></div>
        </div>
        <button class="admin-submit" id="product-form-submit" onclick="saveProduct()"></button>
        <button class="admin-cancel" id="product-form-cancel" style="display:none;" onclick="cancelEditProduct()"></button>
      </div>

      <div class="admin-panel">
        <h2 id="all-products-title"></h2>
        <table class="admin-table">
          <thead><tr>
            <th id="th-image"></th><th id="th-name"></th><th id="th-category"></th><th id="th-price"></th><th id="th-stock"></th><th></th>
          </tr></thead>
          <tbody id="admin-product-table"></tbody>
        </table>
      </div>
    </div>

    <div class="admin-tab-panel" id="tab-categories">
      <div class="admin-panel">
        <h2 id="categories-title"></h2>
        <div id="category-manage-list"></div>
        <div class="cat-add-row">
          <input id="new-cat-name" type="text" />
          <button id="add-cat-btn" onclick="addCategory()"></button>
        </div>
      </div>
    </div>

    <div class="admin-tab-panel" id="tab-users">
      <div class="admin-panel">
        <h2 id="users-title"></h2>
        <table class="admin-table">
          <thead><tr>
            <th id="th-name2"></th><th id="th-email"></th><th id="th-phone"></th><th id="th-verified"></th><th></th>
          </tr></thead>
          <tbody id="admin-users-table"></tbody>
        </table>
        <p class="checkout-note" id="admin-users-empty" style="display:none;"></p>
      </div>
    </div>

    <div class="admin-tab-panel" id="tab-orders">
      <div class="admin-panel">
        <h2 id="orders-title"></h2>
        <p class="orders-count" id="orders-count"></p>
        <div class="orders-toolbar">
          <input id="orders-search" type="text" oninput="renderOrdersTable()" />
          <select id="orders-category-filter" onchange="renderOrdersTable()"></select>
        </div>
        <table class="admin-table">
          <thead><tr>
            <th id="th-date"></th><th id="th-customer"></th><th id="th-address"></th><th id="th-products"></th><th id="th-amount"></th><th id="th-payment"></th><th id="th-status"></th><th></th>
          </tr></thead>
          <tbody id="admin-orders-table"></tbody>
        </table>
        <p class="checkout-note" id="admin-orders-empty" style="display:none;"></p>
      </div>
    </div>
  </div>
</section>

<footer id="site-footer">
  <div class="footer-inner">
    <div>
      <h4>ALVARENO</h4>
      <a id="f-about"></a>
      <a id="f-contact"></a>
      <a onclick="showAdmin()" id="f-admin"></a>

    <div>
      <h4 id="f-service-title"></h4>
      <a id="f-shipping"></a>
      <a id="f-returns"></a>
      <a id="f-sizes"></a>

      <h4 id="f-legal-title"></h4>
      <a id="f-imprint"></a>
      <a id="f-privacy"></a>
      <a id="f-terms"></a>
    </div>
  </div>
  <div class="footer-bottom">
    <span>© 2026 ALVARENO</span>
    <span id="f-tagline"></span>
  </div>
</footer>

      const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
      const matchesSearch = !searchTerm || prodName(p).toLowerCase().includes(searchTerm) || prodShort(p).toLowerCase().includes(searchTerm);
      return matchesCategory && matchesSearch;
    });

  function submitReview(slug) {
    if (!currentUser || !currentUser.verified) { showAuth('login'); return; }
    const p = products.find(x => x.slug === slug);
    const rating = parseInt(document.getElementById('review-rating').value, 10);
    const text = document.getElementById('review-text').value.trim();
    if (!text) { alert(t('reviewTextRequired')); return; }
    p.reviews.push({ author: currentUser.firstName + ' ' + currentUser.lastName.charAt(0) + '.', rating, text: { en: text, de: text } });
    p.rating = p.reviews.reduce((s, r) => s + r.rating, 0) / p.reviews.length;
    p.reviewCount = p.reviews.length;
    renderDetail(p);
  }

  /* ---------------- Warenkorb ---------------- */
  function cartCount() { return cart.reduce((s, i) => s + i.qty, 0); }
  function updateCartBadge() { document.getElementById('cart-count').textContent = cartCount(); }

  function addToCart(slug) {
    if (!currentUser || !currentUser.verified) { afterAuthAction = () => addToCart(slug); showAuth('login'); return; }
    const existing = cart.find(i => i.slug === slug);
    if (existing) existing.qty += 1; else cart.push({ slug, qty: 1 });
    updateCartBadge();
  }

  function changeCartQty(slug, delta) {
    const item = cart.find(i => i.slug === slug);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) cart = cart.filter(i => i.slug !== slug);
    updateCartBadge();
    renderCart();
  }

  function removeFromCart(slug) {
    cart = cart.filter(i => i.slug !== slug);
    updateCartBadge();
    renderCart();
  }

  function renderCart() {
    const wrap = document.getElementById('cart-wrap');
    if (cart.length === 0) {
      wrap.innerHTML = `<h1>${t('cartTitle')}</h1><p class="cart-empty">${t('cartEmpty')}</p>`;
      return;
    }
    let total = 0;
    const rows = cart.map(item => {
      const p = products.find(x => x.slug === item.slug);
      if (!p) return '';
      const lineTotal = p.price * item.qty;
      total += lineTotal;
      return `
        <div class="cart-row">
          <img src="${p.images[0]}" alt="${prodName(p)}" />
          <div class="info">
            <div class="name">${prodName(p)}</div>
            <div class="unit-price">${fmtPrice(p.price)} ${t('perItem')}</div>
          </div>
          <div class="cart-qty">
            <button onclick="changeCartQty('${p.slug}', -1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeCartQty('${p.slug}', 1)">+</button>
          </div>
          <div class="line-total">${fmtPrice(lineTotal)}</div>
          <span class="cart-remove" onclick="removeFromCart('${p.slug}')">${t('remove')}</span>
        </div>
      `;
    }).join('');
    wrap.innerHTML = `
      <h1>${t('cartTitle')}</h1>
      ${rows}
      <div class="cart-total-row"><span>${t('total')}</span><span>${fmtPrice(total)}</span></div>
      <button class="checkout-submit" onclick="checkoutFromCart()">${t('goToCheckout')}</button>
    `;
  }

  function showCart() { setActiveView('cart-view'); renderCart(); }

  /* ---------------- Kasse ---------------- */
  function buyNow(slug) {
    if (!currentUser || !currentUser.verified) { afterAuthAction = () => buyNow(slug); showAuth('login'); return; }
    checkoutItems = [{ slug, qty: 1 }];
    startCheckout(false);
  }
  function checkoutFromCart() {
    if (!currentUser || !currentUser.verified) { afterAuthAction = () => checkoutFromCart(); showAuth('login'); return; }
    if (cart.length === 0) return;
    checkoutItems = cart.map(i => ({ ...i }));
    startCheckout(true);
  }

  function startCheckout(fromCart) {
    checkoutFromCartFlag = fromCart;
    setActiveView('checkout-view');
    document.getElementById('checkout-back').textContent = fromCart ? t('backToCart') : t('backToOverview');
    document.getElementById('checkout-back').onclick = fromCart ? showCart : showHome;
    document.getElementById('checkout-confirm-wrap').style.display = 'none';
    document.getElementById('checkout-form-wrap').style.display = 'block';
    document.getElementById('checkout-back').style.display = 'block';

    let total = 0;
    const rows = checkoutItems.map(item => {
      const p = products.find(x => x.slug === item.slug);
      const lineTotal = p.price * item.qty;
      total += lineTotal;
      return `
        <div class="checkout-summary-row">
          <img src="${p.images[0]}" alt="${prodName(p)}" />
          <span class="name">${prodName(p)}</span><span class="qty">× ${item.qty}</span>
          <span class="price">${fmtPrice(lineTotal)}</span>
        </div>
      `;
    }).join('');

          <div class="full"><label>${t('email')}</label><input id="co-email" type="email" value="${currentUser ? currentUser.email : ''}" /></div>

          <div><label>${t('zip')}</label><input id="co-zip" type="text" /></div>
          <div><label>${t('city')}</label><input id="co-city" type="text" /></div>

      </div>

        <h2>${t('paymentMethod')}</h2>
        <div class="payment-toggle">
          <label><input type="radio" name="pay-method" value="card" checked onchange="togglePaymentFields()" /> ${lang==='de'?'Kreditkarte':'Credit card'}</label>

          <label><input type="radio" name="pay-method" value="klarna" onchange="togglePaymentFields()" /> Klarna</label>

        </div>
        <div id="pay-card-fields" class="checkout-grid">
          <div class="full"><label>${t('cardName')}</label><input id="co-card-name" type="text" /></div>
          <div class="full"><label>${t('cardNumber')}</label><input id="co-card-number" type="text" inputmode="numeric" placeholder="1234 5678 9012 3456" /></div>

  function togglePaymentFields() {
    const method = document.querySelector('input[name="pay-method"]:checked').value;
    document.getElementById('pay-card-fields').style.display = method === 'card' ? 'grid' : 'none';
    document.getElementById('pay-sepa-fields').style.display = method === 'sepa' ? 'grid' : 'none';
    document.getElementById('pay-redirect-note').style.display = (method === 'paypal' || method === 'klarna' || method === 'applegoogle') ? 'block' : 'none';
  }

  function submitOrder(fromCart) {
    const first = document.getElementById('co-first').value.trim();
    const last = document.getElementById('co-last').value.trim();
    const email = document.getElementById('co-email').value.trim();
    const street = document.getElementById('co-street').value.trim();
    const zip = document.getElementById('co-zip').value.trim();
    const city = document.getElementById('co-city').value.trim();
    const method = document.querySelector('input[name="pay-method"]:checked').value;

    if (!first || !last || !email || !street || !zip || !city) { alert(t('fillAllFields')); return; }

    let paymentLabel;
    if (method === 'card') {
      const number = document.getElementById('co-card-number').value.replace(/\s+/g, '');
      if (number.length < 12) { alert(t('validCard')); return; }
      paymentLabel = 'Card •••• ' + number.slice(-4);
    } else if (method === 'sepa') {
      const iban = document.getElementById('co-iban').value.replace(/\s+/g, '');
      if (iban.length < 8) { alert(t('validIban')); return; }
      paymentLabel = 'SEPA •••• ' + iban.slice(-4);
    } else if (method === 'paypal') {
      paymentLabel = 'PayPal';
    } else if (method === 'klarna') {
      paymentLabel = 'Klarna';
    } else {
      paymentLabel = 'Apple Pay / Google Pay';
    }

    let total = 0;
    const items = [];
    checkoutItems.forEach(item => {
      const p = products.find(x => x.slug === item.slug);
      if (p.stock > 0) p.stock = Math.max(0, p.stock - item.qty);
      total += p.price * item.qty;
      items.push({ slug: p.slug, name: prodName(p), category: p.category, qty: item.qty, price: p.price });
    });

    orders.push({
      id: nextOrderId++,
      date: new Date().toLocaleDateString('en-GB'),
      customer: `${first} ${last}`,
      email,
      address: `${street}, ${zip} ${city}`,
      items,
      amount: total,
      payment: paymentLabel,
      status: 'pending'
    });

    if (fromCart) { cart = []; updateCartBadge(); }

    document.getElementById('checkout-form-wrap').style.display = 'none';
    document.getElementById('checkout-back').style.display = 'none';
    const confirmWrap = document.getElementById('checkout-confirm-wrap');
    confirmWrap.style.display = 'block';
    confirmWrap.innerHTML = `
      <div class="order-confirm">
        <h1>${t('orderConfirmTitle')}</h1>
        <p>${tp('thankYou', { name: first, amount: fmtPrice(total) })}</p>
        <button onclick="showHome()">${t('backToShopBtn')}</button>
      </div>
    `;
  }

  /* ---------------- Kundenkonto ---------------- */
  function showAuth(mode) {
    authMode = mode;
    setActiveView('auth-view');
    if (mode === 'login') renderLoginForm();
    else if (mode === 'register') renderRegisterForm();
    else if (mode === 'verify') renderVerifyForm();
  }

  function renderLoginForm() {
    document.getElementById('auth-wrap').innerHTML = `
      <h1>${t('signInTitle')}</h1>
      <p class="auth-sub">${t('signInSub')}</p>
      <p class="auth-error" id="auth-error">${t('wrongCreds')}</p>
      <label>${t('email')}</label>
      <input id="login-email" type="email" />
      <label>${t('password')}</label>
      <input id="login-password" type="password" />
      <button class="primary" onclick="attemptLogin()">${t('signIn')}</button>
      <div class="auth-switch">${t('noAccount')} <a onclick="showAuth('register')">${t('registerNow')}</a></div>
    `;
  }

  function attemptLogin() {
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;
    const user = users.find(u => u.email.toLowerCase() === email && u.password === password);
    if (!user) { document.getElementById('auth-error').style.display = 'block'; return; }
    if (!user.verified) {
      pendingUser = user; pendingChannel = 'email'; pendingCode = genCode();
      showAuth('verify');
      return;
    }
    currentUser = user;
    updateAccountLabel();
    const action = afterAuthAction; afterAuthAction = null;
    if (action) action(); else showHome();
  }

  function renderRegisterForm() {
    document.getElementById('auth-wrap').innerHTML = `
      <h1>${t('registerTitle')}</h1>
      <p class="auth-sub">${t('registerSub')}</p>
      <p class="auth-error" id="auth-error">${t('fillAllFieldsReg')}</p>
      <label>${t('firstName')}</label><input id="reg-first" type="text" />
      <label>${t('lastName')}</label><input id="reg-last" type="text" />
      <label>${t('email')}</label><input id="reg-email" type="email" />
      <label>${t('phone')}</label><input id="reg-phone" type="tel" placeholder="+49 151 23456789" />
      <label>${t('password')}</label><input id="reg-password" type="password" />
      <label>${t('verifyVia')}</label>
      <div class="verify-toggle">
        <label><input type="radio" name="verify-channel" value="email" checked /> ${t('viaEmail')}</label>
        <label><input type="radio" name="verify-channel" value="phone" /> ${t('viaSms')}</label>
      </div>
      <button class="primary" onclick="attemptRegister()">${t('registerBtn')}</button>
      <div class="auth-switch">${t('alreadyAccount')} <a onclick="showAuth('login')">${t('signIn')}</a></div>
    `;
  }

  function attemptRegister() {
    const firstName = document.getElementById('reg-first').value.trim();
    const lastName = document.getElementById('reg-last').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const password = document.getElementById('reg-password').value;
    const channel = document.querySelector('input[name="verify-channel"]:checked').value;

    if (!firstName || !lastName || !email || !phone || password.length < 4) {
      document.getElementById('auth-error').textContent = t('fillAllFieldsReg');
      document.getElementById('auth-error').style.display = 'block';
      return;
    }
    if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
      document.getElementById('auth-error').textContent = t('emailTaken');
      document.getElementById('auth-error').style.display = 'block';
      return;
    }

    const user = { id: nextUserId++, firstName, lastName, email, phone, password, verified: false };
    users.push(user);
    pendingUser = user; pendingChannel = channel; pendingCode = genCode();
    showAuth('verify');
  }

  function renderVerifyForm() {
    const target = pendingChannel === 'phone' ? pendingUser.phone : pendingUser.email;
    const channelLabel = pendingChannel === 'phone' ? t('viaSms') : t('viaEmail');
    document.getElementById('auth-wrap').innerHTML = `
      <h1>${t('verifyTitle')}</h1>
      <p class="auth-sub">${tp('verifySub', { channel: channelLabel, target })}</p>
      <div class="demo-code-box">
        ${tp('demoModeNote', { channel: channelLabel })}
        <strong>${pendingCode}</strong>
      </div>
      <p class="auth-error" id="auth-error">${t('wrongCode')}</p>
      <label>${t('enterCode')}</label>
      <input id="verify-code-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" />
      <button class="primary" onclick="confirmVerifyCode()">${t('confirm')}</button>
      <div class="resend-link">${t('noCode')} <a onclick="resendCode()">${t('resend')}</a></div>
    `;
  }

  function resendCode() { pendingCode = genCode(); renderVerifyForm(); }

  function confirmVerifyCode() {
    const entered = document.getElementById('verify-code-input').value.trim();
    if (entered !== pendingCode) { document.getElementById('auth-error').style.display = 'block'; return; }
    pendingUser.verified = true;
    currentUser = pendingUser;
    pendingUser = null; pendingCode = null;
    updateAccountLabel();
    if (isAdminLoggedIn) renderUsersTable();
    const action = afterAuthAction; afterAuthAction = null;
    if (action) action(); else showHome();
  }

  function logoutUser() { currentUser = null; updateAccountLabel(); showHome(); }

  function updateAccountLabel() {
    const action = document.getElementById('account-action');
    const label = document.getElementById('account-label');
    if (currentUser) { label.textContent = currentUser.firstName; action.onclick = logoutUser; }
    else { label.textContent = t('signIn'); action.onclick = () => showAuth('login'); }
  }

  /* ---------------- Admin ---------------- */
  function attemptAdminLogin() {
    const email = document.getElementById('admin-email').value.trim();
    const pass = document.getElementById('admin-pass').value;
    if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
      isAdminLoggedIn = true;
      document.getElementById('admin-error').style.display = 'none';
      showAdminDashboard();
    } else {
      document.getElementById('admin-error').style.display = 'block';
    }
  }

  function showAdminDashboard() {
    document.getElementById('admin-login-block').style.display = 'none';
    document.getElementById('admin-dash-block').style.display = 'block';
    renderAdminTabs();
    renderCategorySelect();
    renderCategoryManageList();
    renderAdminTable();
    renderUsersTable();
    updateOrdersCategoryFilter();
    renderOrdersTable();
    switchAdminTab(activeAdminTab);
  }

  function renderAdminTabs() {
    const tabs = [
      { id: 'products', label: t('tabProducts') },
      { id: 'categories', label: t('tabCategories') },
      { id: 'users', label: t('tabUsers') },
      { id: 'orders', label: t('tabOrders') }
    ];
    document.getElementById('admin-tabs').innerHTML = tabs.map(tb => `
      <button class="admin-tab-btn ${activeAdminTab === tb.id ? 'active' : ''}" onclick="switchAdminTab('${tb.id}')">${tb.label}</button>
    `).join('');
  }

  function switchAdminTab(id) {
    activeAdminTab = id;
    renderAdminTabs();
    ['products','categories','users','orders'].forEach(x => document.getElementById('tab-' + x).classList.toggle('active', x === id));
  }

  function renderCategorySelect() {
    document.getElementById('new-category').innerHTML = categories.map(c => `<option value="${c.id}">${c.label[lang]}</option>`).join('');
  }

  function renderCategoryManageList() {
    document.getElementById('category-manage-list').innerHTML = categories.map(c => `
      <div class="cat-manage-row">
        <span>${c.label[lang]}</span>
        <button class="delete-btn" onclick="deleteCategory('${c.id}')">${t('deleteBtn')}</button>
      </div>
    `).join('') || `<p class="checkout-note">${t('noCategories')}</p>`;
  }

  function addCategory() {
    const input = document.getElementById('new-cat-name');
    const name = input.value.trim();
    if (!name) return;
    const id = slugify(name);
    if (categories.some(c => c.id === id)) { alert(t('categoryExists')); return; }
    categories.push({ id, label: { en: name, de: name } });
    input.value = '';
    renderCategoryManageList();
    renderCategorySelect();
    renderCategoryRow();
    updateOrdersCategoryFilter();
  }

  function deleteCategory(id) {
    if (products.some(p => p.category === id)) { alert(t('categoryInUse')); return; }
    categories = categories.filter(c => c.id !== id);
    if (currentCategory === id) currentCategory = 'all';
    renderCategoryManageList();
    renderCategorySelect();
    renderCategoryRow();
    updateOrdersCategoryFilter();
  }

  function renderAdminTable() {
    document.getElementById('admin-product-table').innerHTML = products.map(p => `
      <tr>
        <td><img src="${p.images[0]}" alt="" /></td>
        <td>${prodName(p)}</td>
        <td>${catLabel(p.category)}</td>
        <td>${fmtPrice(p.price)}</td>
        <td><input class="stock-input" type="number" min="0" value="${p.stock}" onchange="updateStock(${p.id}, this.value)" /></td>
        <td class="row-actions">
          <button class="edit-btn" onclick="editProduct(${p.id})">${t('edit')}</button>
          <button class="delete-btn" onclick="deleteProduct(${p.id})">${t('deleteBtn')}</button>
        </td>
      </tr>
    `).join('');
  }

  function updateStock(id, value) {
    const p = products.find(x => x.id === id);
    p.stock = Math.max(0, parseInt(value, 10) || 0);
  }

  function deleteProduct(id) {
    const p = products.find(x => x.id === id);
    if (!confirm(tp('confirmDeleteProduct', { name: prodName(p) }))) return;
    products = products.filter(x => x.id !== id);
    if (editingProductId === id) cancelEditProduct();
    renderAdminTable();
  }

  function editProduct(id) {
    const p = products.find(x => x.id === id);
    editingProductId = id;
    document.getElementById('product-form-title').textContent = tp('editingProduct', { name: prodName(p) });
    document.getElementById('new-name').value = prodName(p);
    document.getElementById('new-category').value = p.category;
    document.getElementById('new-price').value = p.price;
    document.getElementById('new-stock').value = p.stock;
    document.getElementById('new-image').value = p.images.join(', ');
    document.getElementById('new-desc').value = prodShort(p);
    document.getElementById('product-form-submit').textContent = t('saveChanges');
    document.getElementById('product-form-cancel').style.display = 'inline-block';
    document.getElementById('product-form-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function cancelEditProduct() {
    editingProductId = null;
    document.getElementById('product-form-title').textContent = t('newProductTitle');
    document.getElementById('new-name').value = '';
    document.getElementById('new-price').value = '';
    document.getElementById('new-stock').value = '';
    document.getElementById('new-image').value = '';
    document.getElementById('new-desc').value = '';
    document.getElementById('product-form-submit').textContent = t('createProductBtn');
    document.getElementById('product-form-cancel').style.display = 'none';
  }

  function saveProduct() {
    const name = document.getElementById('new-name').value.trim();
    const category = document.getElementById('new-category').value;
    const price = parseFloat(document.getElementById('new-price').value);
    const stock = parseInt(document.getElementById('new-stock').value, 10);
    const imagesRaw = document.getElementById('new-image').value.trim();
    const images = imagesRaw ? imagesRaw.split(',').map(s => s.trim()).filter(Boolean) : ['https://picsum.photos/seed/alvareno-new/700/700'];
    const desc = document.getElementById('new-desc').value.trim();

    if (!name || isNaN(price) || isNaN(stock)) { alert(t('fillNamePriceStock')); return; }

    if (editingProductId) {
      const p = products.find(x => x.id === editingProductId);
      p.name[lang] = name; p.category = category; p.price = price; p.stock = stock;
      p.images = images; if (desc) p.shortDescription[lang] = desc;
      cancelEditProduct();
    } else {
      products.push({
        id: nextId++,
        slug: slugify(name) + '-' + Date.now(),
        category, price, oldPrice: null, stock,
        rating: 0, reviewCount: 0,
        name: { en: name, de: name },
        shortDescription: { en: desc || name, de: desc || name },
        description: { en: desc || name, de: desc || name },
        images, variants: [], reviews: []
      });
    }

    renderAdminTable();
    renderGrid();
  }

  function renderUsersTable() {
    const tbody = document.getElementById('admin-users-table');
    const empty = document.getElementById('admin-users-empty');
    if (users.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>
          <input class="table-input" style="width:70px;display:inline-block;" value="${u.firstName}" onchange="updateUserField(${u.id}, 'firstName', this.value)" />
          <input class="table-input" style="width:70px;display:inline-block;" value="${u.lastName}" onchange="updateUserField(${u.id}, 'lastName', this.value)" />
        </td>
        <td><input class="table-input" value="${u.email}" onchange="updateUserField(${u.id}, 'email', this.value)" /></td>
        <td><input class="table-input" value="${u.phone}" onchange="updateUserField(${u.id}, 'phone', this.value)" /></td>
        <td>
          <span class="verified-pill ${u.verified ? 'yes' : 'no'}">${u.verified ? t('yes') : t('no')}</span>
          <button class="edit-btn" style="margin-top:6px;" onclick="toggleUserVerified(${u.id})">${u.verified ? t('resetVerify') : t('verify')}</button>
        </td>
        <td><button class="delete-btn" onclick="deleteUser(${u.id})">${t('deleteBtn')}</button></td>
      </tr>
    `).join('');
  }

  function updateUserField(id, field, value) {
    const u = users.find(x => x.id === id);
    u[field] = value.trim();
    if (currentUser && currentUser.id === id) { currentUser = u; updateAccountLabel(); }
  }

  function toggleUserVerified(id) {
    const u = users.find(x => x.id === id);
    u.verified = !u.verified;
    renderUsersTable();
  }

  function deleteUser(id) {
    const u = users.find(x => x.id === id);
    if (!confirm(tp('confirmDeleteUser', { name: u.firstName + ' ' + u.lastName }))) return;
    users = users.filter(x => x.id !== id);
    if (currentUser && currentUser.id === id) { currentUser = null; updateAccountLabel(); }
    renderUsersTable();
  }

  function updateOrdersCategoryFilter() {
    const select = document.getElementById('orders-category-filter');
    if (!select) return;
    const current = select.value || 'all';
    select.innerHTML = `<option value="all">${t('allCategories')}</option>` + categories.map(c => `<option value="${c.id}">${c.label[lang]}</option>`).join('');
    select.value = current;
  }

  function renderOrdersTable() {
    const tbody = document.getElementById('admin-orders-table');
    const empty = document.getElementById('admin-orders-empty');
    const searchVal = (document.getElementById('orders-search').value || '').trim().toLowerCase();
    const catVal = document.getElementById('orders-category-filter').value || 'all';

    const filtered = orders.filter(o => {
      const matchesName = !searchVal || o.customer.toLowerCase().includes(searchVal);
      const matchesCategory = catVal === 'all' || o.items.some(it => it.category === catVal);
      return matchesName && matchesCategory;
    });

    document.getElementById('orders-count').textContent = tp('ordersCount', { n: filtered.length }) + (filtered.length !== orders.length ? ` / ${orders.length}` : '');

    if (filtered.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    const statusLabel = (s) => ({ pending: t('statusPending'), paid: t('statusPaid'), shipped: t('statusShipped'), cancelled: t('statusCancelled') }[s]);

    tbody.innerHTML = filtered.map(o => `
      <tr>
        <td>${o.date}</td>
        <td>${o.customer}<br><span class="checkout-note">${o.email}</span></td>
        <td>${o.address}</td>
        <td>${o.items.map(it => `${it.name} ×${it.qty}`).join(', ')}</td>
        <td>${fmtPrice(o.amount)}</td>
        <td>${o.payment}</td>
        <td>
          <select class="status-select" onchange="updateOrderStatus(${o.id}, this.value)">
            <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>${t('statusPending')}</option>
            <option value="paid" ${o.status === 'paid' ? 'selected' : ''}>${t('statusPaid')}</option>
            <option value="shipped" ${o.status === 'shipped' ? 'selected' : ''}>${t('statusShipped')}</option>
            <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>${t('statusCancelled')}</option>
          </select>
        </td>
        <td><button class="delete-btn" onclick="deleteOrder(${o.id})">${t('deleteBtn')}</button></td>
      </tr>
    `).join('');
  }

  function updateOrderStatus(id, status) {
    const o = orders.find(x => x.id === id);
    o.status = status;
  }

  function deleteOrder(id) {
    if (!confirm(t('confirmDeleteOrder'))) return;
    orders = orders.filter(x => x.id !== id);
    renderOrdersTable();
  }

    document.getElementById('detail-view').classList.remove('active');
    document.getElementById('cart-view').classList.remove('active');
    document.getElementById('checkout-view').classList.remove('active');
    document.getElementById('auth-view').classList.remove('active');
    document.getElementById('admin-view').classList.remove('active');
    document.getElementById('site-footer').style.display = (id === 'admin-view') ? 'none' : 'block';
    if (id === 'home-view') { document.getElementById('home-view').style.display = 'block'; }
    else { document.getElementById(id).classList.add('active'); }
  }

  function showAdmin() {
    setActiveView('admin-view');
    document.getElementById('admin-login-block').style.display = isAdminLoggedIn ? 'none' : 'block';
